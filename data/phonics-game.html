<title>Phonics Picture Match — a demo for Huong</title>
<style>
  :root{
    --sky:#EAF6FF; --sky2:#D6ECFF;
    --ink:#22315B; --ink-soft:#5C6B92;
    --coral:#FF6B6B; --sun:#FFC93C; --grass:#38C172; --grape:#7C5CFF;
    --card:#FFFFFF; --line:#E3ECF7;
    --shadow:0 10px 0 rgba(34,49,91,.10), 0 18px 40px rgba(34,49,91,.16);
    --round-face:"Comic Sans MS","Chalkboard SE","Comic Neue",ui-rounded,"Segoe UI Rounded",system-ui,sans-serif;
    --ui-face:ui-rounded,"Segoe UI Rounded","Nunito",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;font-family:var(--ui-face);color:var(--ink);
    background:radial-gradient(120% 90% at 50% -10%,var(--sky) 0%,var(--sky2) 60%,#C6E2FB 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;
    overflow-x:hidden;
  }
  .stage{width:min(560px,100%);position:relative}
  .board{
    background:var(--card);border-radius:32px;padding:26px 24px 30px;
    box-shadow:var(--shadow);border:3px solid #fff;position:relative;
  }

  /* top bar */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
  .badge{font-size:.82rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft)}
  .stars{font-size:1.25rem;letter-spacing:2px;min-height:1.4em}
  .progress{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 20px}
  .progress > i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--sun),var(--coral));transition:width .4s cubic-bezier(.3,1.3,.5,1)}

  /* picture */
  .picture{
    display:flex;align-items:center;justify-content:center;
    height:180px;border-radius:26px;margin-bottom:6px;
    background:linear-gradient(180deg,#FFFDF5,#FFF3D6);
    border:3px dashed #F1D98A;position:relative;user-select:none;
  }
  .emoji{font-size:6.4rem;line-height:1;filter:drop-shadow(0 8px 10px rgba(0,0,0,.12))}
  .say{
    position:absolute;right:14px;bottom:12px;border:none;cursor:pointer;
    width:52px;height:52px;border-radius:50%;background:var(--grape);color:#fff;
    font-size:1.5rem;box-shadow:0 5px 0 #5b3fe0;transition:transform .12s,box-shadow .12s;
  }
  .say:active{transform:translateY(4px);box-shadow:0 1px 0 #5b3fe0}

  .prompt{text-align:center;font-weight:800;color:var(--ink-soft);margin:16px 0 14px;font-size:1.05rem}

  /* choices */
  .choices{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:440px){.choices{grid-template-columns:1fr;}}
  .choice{
    font-family:var(--round-face);font-weight:700;font-size:1.9rem;letter-spacing:.02em;
    padding:18px 6px;border-radius:20px;border:3px solid var(--line);
    background:#fff;color:var(--ink);cursor:pointer;text-transform:lowercase;
    box-shadow:0 5px 0 var(--line);transition:transform .12s,box-shadow .12s,background .12s,border-color .12s;
  }
  .choice:hover{transform:translateY(-2px);border-color:#CFE0F3}
  .choice:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
  .choice:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
  .choice.right{background:var(--grass);border-color:#2ca35f;color:#fff;box-shadow:0 5px 0 #2ca35f;animation:pop .4s}
  .choice.wrong{background:#FFE1E1;border-color:var(--coral);color:var(--coral);animation:shake .4s}
  .choice.dim{opacity:.45}

  .feedback{text-align:center;font-family:var(--round-face);font-weight:700;font-size:1.4rem;
    min-height:1.6em;margin-top:18px;color:var(--grass)}
  .feedback.miss{color:var(--coral)}

  /* end screen */
  .end{text-align:center;padding:8px 4px}
  .end .big{font-size:4rem;margin:4px 0}
  .end h2{font-family:var(--round-face);font-size:2rem;margin:.2em 0}
  .end p{color:var(--ink-soft);font-size:1.1rem;margin:.2em 0 1em}
  .btn{
    font-family:var(--round-face);font-weight:700;font-size:1.3rem;border:none;cursor:pointer;
    padding:14px 30px;border-radius:99px;background:var(--coral);color:#fff;
    box-shadow:0 6px 0 #d84f4f;transition:transform .12s,box-shadow .12s;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d84f4f}

  .sig{text-align:center;margin-top:16px;color:var(--ink-soft);font-size:.8rem;font-weight:700;opacity:.75}

  canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:5}

  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>

<div class="stage">
  <div class="board" id="board">
    <div class="top">
      <span class="badge" id="counter">Word 1 of 8</span>
      <span class="stars" id="stars"></span>
    </div>
    <div class="progress"><i id="bar"></i></div>

    <div class="picture">
      <span class="emoji" id="emoji">🐱</span>
      <button class="say" id="say" title="Hear the word" aria-label="Hear the word">🔊</button>
    </div>

    <p class="prompt">Which word matches the picture?</p>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback">&nbsp;</div>
  </div>
  <p class="sig">🎈 A little demo built with Claude — this is what we'll learn to make together, Huong.</p>
</div>

<canvas class="confetti" id="cfx"></canvas>

<script>
const WORDS = [
  {emoji:"🐱", word:"cat", options:["cat","cot","cut"]},
  {emoji:"🐶", word:"dog", options:["dog","dig","dug"]},
  {emoji:"🐷", word:"pig", options:["pig","peg","pug"]},
  {emoji:"☀️", word:"sun", options:["sun","bun","run"]},
  {emoji:"🎩", word:"hat", options:["hat","hot","hit"]},
  {emoji:"🛏️", word:"bed", options:["bed","bad","bud"]},
  {emoji:"☕", word:"cup", options:["cup","cap","cop"]},
  {emoji:"🦊", word:"fox", options:["fox","fix","fax"]},
  {emoji:"🖊️", word:"pen", options:["pen","pan","pin"]},
  {emoji:"🚌", word:"bus", options:["bus","bug","bun"]},
  {emoji:"🐔", word:"hen", options:["hen","pen","ten"]},
  {emoji:"🐛", word:"bug", options:["bug","bag","big"]},
];

const PRAISE = ["Great job! 🌟","Well done! 🎉","You got it! 👏","Super! 💫","Brilliant! ✨","Yes! 🙌"];
const NUDGE  = ["Try again! 💛","Almost! Listen again 🔊","Not yet — you can do it!"];

const ROUNDS = 8;
let deck=[], idx=0, score=0, locked=false;

const $ = id => document.getElementById(id);

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function speak(w){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(w);
    u.lang="en-US"; u.rate=.8; u.pitch=1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}

function start(){
  deck = shuffle(WORDS).slice(0,ROUNDS);
  idx=0; score=0;
  renderStars();
  render();
}

function renderStars(){
  $("stars").textContent = "⭐".repeat(score);
}

function render(){
  locked=false;
  const q = deck[idx];
  $("counter").textContent = `Word ${idx+1} of ${ROUNDS}`;
  $("bar").style.width = `${(idx/ROUNDS)*100}%`;
  $("emoji").textContent = q.emoji;
  $("feedback").textContent = " ";
  $("feedback").className = "feedback";

  const box = $("choices");
  box.innerHTML = "";
  shuffle(q.options).forEach(opt=>{
    const b=document.createElement("button");
    b.className="choice"; b.textContent=opt;
    b.onclick=()=>choose(b,opt,q.word);
    box.appendChild(b);
  });
  speak(q.word);
}

function choose(btn, opt, answer){
  if(locked) return;
  if(opt===answer){
    locked=true;
    btn.classList.add("right");
    [...document.querySelectorAll(".choice")].forEach(c=>{if(c!==btn)c.classList.add("dim")});
    score++; renderStars();
    const f=$("feedback"); f.textContent=PRAISE[Math.floor(Math.random()*PRAISE.length)];
    burst();
    setTimeout(()=>{
      idx++;
      if(idx>=ROUNDS){ $("bar").style.width="100%"; end(); }
      else render();
    },1150);
  }else{
    btn.classList.add("wrong");
    const f=$("feedback"); f.textContent=NUDGE[Math.floor(Math.random()*NUDGE.length)]; f.className="feedback miss";
    setTimeout(()=>btn.classList.remove("wrong"),450);
    setTimeout(()=>{btn.classList.add("dim"); btn.disabled=true;},460);
  }
}

function end(){
  const pct=Math.round(score/ROUNDS*100);
  let mood = pct>=100?["🏆","Perfect!","You are a phonics star!"]
           : pct>=75 ?["🌟","Wonderful!","So close to perfect — play again!"]
           : pct>=50 ?["😊","Good work!","Keep practising, you're getting it!"]
           :          ["🌱","Nice try!","Let's play once more together!"];
  $("board").innerHTML =
    `<div class="end">
       <div class="big">${mood[0]}</div>
       <h2>${mood[1]}</h2>
       <p>${mood[2]}<br><b>${score} / ${ROUNDS} stars</b> ${"⭐".repeat(score)}</p>
       <button class="btn" id="again">Play again ▶</button>
     </div>`;
  $("again").onclick=()=>{ location.reload(); };
  if(pct>=75) rain();
}

/* ---- confetti ---- */
const cvs=$("cfx"), ctx=cvs.getContext("2d");
let parts=[], raf=null;
function fit(){cvs.width=innerWidth;cvs.height=innerHeight}
fit(); addEventListener("resize",fit);
const COLORS=["#FF6B6B","#FFC93C","#38C172","#7C5CFF","#4EA8FF"];
function reduced(){return matchMedia("(prefers-reduced-motion:reduce)").matches}
function burst(){
  if(reduced())return;
  for(let i=0;i<26;i++)parts.push({
    x:innerWidth/2,y:innerHeight*0.42,
    vx:(Math.random()-.5)*9,vy:-Math.random()*10-4,
    g:.35+Math.random()*.2,s:6+Math.random()*6,
    c:COLORS[i%COLORS.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:60
  });
  run();
}
function rain(){
  if(reduced())return;
  for(let i=0;i<120;i++)parts.push({
    x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*0.5,
    vx:(Math.random()-.5)*2,vy:2+Math.random()*3,
    g:.05,s:6+Math.random()*7,c:COLORS[i%COLORS.length],r:Math.random()*6,vr:(Math.random()-.5)*.3,life:200
  });
  run();
}
function run(){ if(!raf) raf=requestAnimationFrame(step) }
function step(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  parts=parts.filter(p=>p.life>0 && p.y<innerHeight+40);
  parts.forEach(p=>{
    p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);
    ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);ctx.restore();
  });
  if(parts.length) raf=requestAnimationFrame(step);
  else { ctx.clearRect(0,0,cvs.width,cvs.height); raf=null; }
}

$("say").onclick=()=>speak(deck[idx].word);
start();
</script>
